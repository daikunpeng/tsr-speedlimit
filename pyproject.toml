[project]
name = "tsr-speedlimit"
version = "0.1.0"
description = "Chinese speed-limit traffic sign detection and classification (YOLOv5 + tiny classifier, RDK X5)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch==2.6.0",
    "torchvision==0.21.0",
    "ultralytics>=8.4.0",
    "pyyaml>=6.0",
    "pillow>=10.0",
    "tqdm>=4.66",
    "pandas>=2.0",
    "matplotlib>=3.8",
]

[tool.uv]
package = false

# Prefer Aliyun for most packages; torch CUDA wheels are installed from
# mirrors.aliyun.com/pytorch-wheels/cu124 (see docs/setup.md).
[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple"
default = true
